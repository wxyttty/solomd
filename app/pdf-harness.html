<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SoloMD · PDF pagination harness</title>
<style>
  body { font: 14px/1.5 ui-monospace, Menlo, Consolas, monospace; margin: 0; padding: 20px; background: #fbfaf6; color: #1f1d1a; }
  h1 { font: 700 18px/1.3 system-ui, sans-serif; margin: 0 0 4px; }
  p.lead { font-family: system-ui, sans-serif; color: #6a6560; margin: 0 0 16px; }
  table { border-collapse: collapse; margin: 12px 0; }
  th, td { border: 1px solid #e6e2d8; padding: 4px 10px; text-align: left; }
  thead th { background: #ffe7cc; }
  .ok { color: #1a7f37; font-weight: 700; }
  .bad { color: #c02b2b; font-weight: 700; }
  #status { padding: 8px 12px; border-left: 4px solid #ff9f40; background: #fff7ec; margin-bottom: 12px; }
  #evidence { margin-top: 16px; }
  #evidence canvas { display: block; margin-bottom: 18px; border: 1px solid #e6e2d8; background: #fff; }
  details { margin: 8px 0 16px; }
</style>
</head>
<body>
  <h1>PDF pagination harness</h1>
  <p class="lead">
    Renders a long markdown document through the real export pipeline and checks
    that no page boundary lands on ink. Results land on <code>window.__pdfHarness</code>.
  </p>
  <div id="status">booting…</div>
  <div id="report"></div>
  <div id="evidence"></div>
  <script type="module" src="/src/dev/pdf-harness.ts"></script>

</html>
