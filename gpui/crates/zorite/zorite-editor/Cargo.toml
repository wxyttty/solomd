# Vendored from https://github.com/packetThrower/zorite @ 2dab499（0.11.0，2026-08-30）。
# 2026-09-13 升级：7915aad → tip；上游三 crate 已转 MIT（原 GPL-3.0-or-later），
# gpui-editor/gpui-markdown 改名 zorite-editor/zorite-markdown，本仓库跟改。
# 与 gpui-whiteboard / ratex-gpui 同 rev；对 f66ed39 的本地 churn 修复见 git log。

[package]
name = "zorite-editor"
version = "0.10.0"
edition = "2024"
description = "A multi-line text editor for GPUI with live Markdown preview, tables, images, and math. The editor behind Zorite's notes."
license = "MIT"
repository = "https://github.com/packetThrower/zorite"
homepage = "https://packetthrower.github.io/zorite/reference/crates/zorite-editor/"
keywords = ["gpui", "editor", "markdown", "wysiwyg", "text-editor"]
categories = ["gui", "text-editors"]

[dependencies]
# Shared workspace spec (the root pins the rev) so Cargo unifies to one gpui.
gpui = { workspace = true }

# Grapheme-cluster boundaries for cursor movement, so an emoji / combining mark
# moves as a single unit (matches gpui's own input example).
unicode-segmentation = "1"

# Shared markdown-construct recognition (`zorite_markdown::syntax`): alert kinds,
# table styles, heading scales — so WYSIWYG and the reader can never drift
# apart on what a construct IS. The one sanctioned sibling-crate dependency
# (see AGENTS.md); rendering stays entirely this crate's own.
zorite-markdown = { path = "../zorite-markdown", version = "0.9", default-features = false }

# Bidi index↔x mapping (#66). gpui's own `x_for_index` / `index_for_x` assume
# byte index and x rise together, which is false for a right-to-left line — so
# every caret/click lookup in this crate goes through `VisualMap` on RTL rows.
gpui-bidi = { path = "../gpui-bidi", version = "0.1" }
