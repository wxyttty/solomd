[package]
name = "solomd-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "solomd"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde = { workspace = true }
serde_json.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
zorite-editor.workspace = true
zorite-markdown.workspace = true
gpui-whiteboard.workspace = true
ratex-gpui.workspace = true
solomd-core = { path = "../core" }
image.workspace = true
mermaid-rs-renderer.workspace = true
dirs.workspace = true
solomd-workspace-hack = { version = "0.0.0", path = "../workspace-hack" }

# macOS 剪贴板富文本：直接调 AppKit 读写 `public.html`（GPUI 的
# ClipboardEntry 只有 String/Image/ExternalPaths，没有 HTML flavor）。
# objc2 三件套本就在依赖树里（gpui_macos 用同版本），这里只是把它们
# 变成直接依赖，不新增编译单元、不改框架。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSPasteboard"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString", "NSData", "std"] }
